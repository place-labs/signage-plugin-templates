<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather Plugin</title>
        <!--
            NOTE: Weather widget backed by the free open-meteo.com forecast
            API (no key required). Three display modes:

            - small:      compact card - location, current temperature,
                          high/low, next precipitation and wind
            - medium:     card with the current conditions plus a six-slot
                          hourly strip
            - fullscreen: full-bleed photographic background matching the
                          weather, with an hourly conditions card and a
                          seven-day forecast card

            The small and medium cards use a semi-transparent rounded
            backing on a fully transparent page, so they can overlay other
            signage content (embed with allowtransparency and
            pointer-events: none). Card size is set in vmax units.

            Forecast data is fetched at most every 3 hours and cached in
            localStorage (persisting across reloads). The UI re-renders
            every minute from the cache, interpolating hourly series to the
            current minute - at half past the hour the shown temperature is
            the average of the two bounding hours.

            Icons are from the react-icons sets used by
            github.com/danisharyanfahim/weather-app-v2 and the fullscreen
            backgrounds from
            github.com/kshitizrohilla/weather-app-using-openweathermap-api,
            embedded as data URIs so the plugin stays self-contained.
        -->
        <style>
            :root {
                /* Alphas are driven by the opacity config (default 62%) */
                --card-alpha: 0.62;
                --card-soft-alpha: 0.45;
                --card-bg: rgb(36 62 105 / var(--card-alpha));
                --card-bg-soft: rgb(52 76 120 / var(--card-soft-alpha));
                --text: #ffffff;
                --text-soft: rgba(255, 255, 255, 0.72);
                --divider: rgba(255, 255, 255, 0.16);
                --track: rgba(0, 0, 0, 0.25);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                /* NOTE: transparent so card modes can overlay other content */
                background: transparent;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                font-family:
                    -apple-system, 'Segoe UI', Roboto, Helvetica, Arial,
                    sans-serif;
                color: var(--text);
                -webkit-font-smoothing: antialiased;
            }
            /* Cards anchor to the top left (the host iframe sets where that
               is); a small gutter keeps the drop shadow off the edge */
            body.mode-small,
            body.mode-medium {
                align-items: flex-start;
                justify-content: flex-start;
                padding: 1vmax;
            }

            /* Weather icons (baked-colour SVG data URIs) */
            .wi {
                display: inline-block;
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;

            /* Only the configured mode's root is shown */
            #card-small,
            #card-medium,
            #screen-full {
                display: none;
            }
            body.mode-small #card-small,
            body.mode-medium #card-medium {
                display: block;
                /* Keep the exact size even in an undersized iframe - the
                   card clips rather than squashing */
                flex-shrink: 0;
            }
            body.mode-fullscreen #screen-full {
                display: flex;
            }

            /* ---------------------------------------------------------------
               Small card
               --------------------------------------------------------------- */

            #card-small {
                width: 13em;
                padding: 1em 1.1em;
                border-radius: 1.1em;
                background: var(--card-bg);
                box-shadow: 0 0.4em 1.6em rgba(0, 0, 0, 0.25);
            }
            #card-small .top {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }
            #card-small .name {
                font-size: 1.05em;
                font-weight: 700;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            #card-small .top .wi {
                width: 1.3em;
                height: 1.3em;
                flex-shrink: 0;
                margin-left: 0.4em;
            }
            #card-small .temp-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 0.05em;
            }
            #card-small .temp {
                font-size: 2.5em;
                font-weight: 300;
                line-height: 1.1;
            }
            #card-small .hilo {
                text-align: right;
                font-size: 0.95em;
                font-weight: 600;
                line-height: 1.35;
            }
            #card-small .hilo .lo {
                color: var(--text-soft);
            }
            #card-small .facts {
                margin-top: 0.8em;
            }
            #card-small .fact + .fact {
                margin-top: 0.55em;
            }
            #card-small .fact .label {
                font-size: 0.95em;
                font-weight: 700;
            }
            #card-small .fact .value {
                font-size: 0.95em;
                font-weight: 600;
                color: var(--text-soft);
            }

            /* ---------------------------------------------------------------
               Medium card
               --------------------------------------------------------------- */

            #card-medium {
                width: 30em;
                padding: 1.1em 1.3em 1.2em;
                border-radius: 1.2em;
                background: var(--card-bg);
                box-shadow: 0 0.4em 1.6em rgba(0, 0, 0, 0.25);
            }
            #card-medium .top {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
            }
            #card-medium .name {
                font-size: 1.15em;
                font-weight: 700;
            }
            #card-medium .temp {
                font-size: 2.6em;
                font-weight: 300;
                line-height: 1.05;
            }
            #card-medium .summary {
                text-align: right;
            }
            #card-medium .summary .wi {
                width: 1.5em;
                height: 1.5em;
                margin-left: auto;
            }
            #card-medium .summary .cond {
                font-size: 1em;
                font-weight: 700;
                margin-top: 0.15em;
            }
            #card-medium .summary .hilo {
                font-size: 0.95em;
                font-weight: 600;
                color: var(--text-soft);
            }
            #card-medium .hours {
                display: flex;
                justify-content: space-between;
                margin-top: 1em;
            }
            #card-medium .hour {
                flex: 1 1 0;
                text-align: center;
            }
            #card-medium .hour .when {
                font-size: 0.85em;
                font-weight: 700;
                color: var(--text-soft);
                white-space: nowrap;
            }
            #card-medium .hour .wi {
                width: 1.6em;
                height: 1.6em;
                margin: 0.35em auto 0.3em;
            }
            #card-medium .hour .t {
                font-size: 1em;
                font-weight: 700;
            }

            /* ---------------------------------------------------------------
               Fullscreen
               --------------------------------------------------------------- */

            #screen-full {
                position: fixed;
                inset: 0;
                flex-direction: column;
                align-items: center;
                overflow: hidden;
                background-size: cover;
                background-position: center;
            }

            /* Darken for legibility */
            #screen-full::before {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    180deg,
                    rgba(10, 16, 40, 0.18) 0%,
                    rgba(10, 16, 40, 0.38) 100%
                );
            }
            #full-content {
                position: relative;
                width: 44em;
                max-width: 94vw;
                padding: 1.6em 0 1.5em;
                display: flex;
                flex-direction: column;
                height: 100%;
            }
            #screen-full .title {
                text-align: center;
                text-shadow: 0 0.05em 0.35em rgba(0, 0, 0, 0.45);
            }
            #screen-full .title .name {
                font-size: 3.2em;
                font-weight: 400;
            }
            #screen-full .title .sub {
                font-size: 2.2em;
                font-weight: 600;
                margin-top: 0.2em;
            }
            #screen-full .panel {
                background: var(--card-bg-soft);
                border-radius: 1em;
                padding: 0.9em 1.2em;
                margin-top: 1.1em;
                overflow: hidden;
            }
            #screen-full .panel-head {
                font-size: 1.05em;
                font-weight: 700;
            }
            #screen-full .panel-sub {
                font-size: 0.85em;
                color: var(--text-soft);
                margin-top: 0.1em;
            }
            #screen-full .hours {
                display: flex;
                justify-content: space-between;
                margin-top: 0.9em;
            }
            #screen-full .hour {
                flex: 1 1 0;
                text-align: center;
            }
            #screen-full .hour .when {
                font-size: 0.9em;
                font-weight: 700;
                color: var(--text-soft);
                white-space: nowrap;
            }
            #screen-full .hour .wi {
                width: 1.9em;
                height: 1.9em;
                margin: 0.4em auto 0.35em;
            }
            #screen-full .hour .t {
                font-size: 1.05em;
                font-weight: 700;
            }
            #daily-panel {
                display: flex;
                flex-direction: column;
            }
            .day-row {
                display: flex;
                align-items: center;
                padding: 0.35em 0;
                max-height: 2.8em;
            }
            .day-row + .day-row {
                border-top: 1px solid var(--divider);
            }
            .day-row .d {
                width: 4.2em;
                font-size: 1.05em;
                font-weight: 700;
                flex-shrink: 0;
            }
            .day-row .cond {
                width: 3.4em;
                text-align: center;
                flex-shrink: 0;
            }
            .day-row .cond .wi {
                width: 1.5em;
                height: 1.5em;
                margin: 0 auto;
            }
            .day-row .cond .pp {
                font-size: 0.72em;
                font-weight: 700;
                color: #7fd4ff;
                line-height: 1;
            }
            .day-row .lo,
            .day-row .hi {
                width: 2.6em;
                font-size: 1.05em;
                font-weight: 700;
                flex-shrink: 0;
                text-align: right;
            }
            .day-row .lo {
                color: var(--text-soft);
            }
            .day-row .range {
                flex: 1 1 auto;
                height: 0.4em;
                margin: 0 0.9em;
                border-radius: 0.2em;
                background: var(--track);
                position: relative;
            }
            .day-row .range .bar {
                position: absolute;
                top: 0;
                bottom: 0;
                border-radius: 0.2em;
            }
            .day-row .range .dot {
                position: absolute;
                top: 50%;
                width: 0.55em;
                height: 0.55em;
                margin: -0.275em 0 0 -0.275em;
                border-radius: 50%;
                background: #ffffff;
                box-shadow: 0 0 0 0.12em rgba(0, 0, 0, 0.35);
            }

            /* ---------------------------------------------------------------
               Error overlay
               --------------------------------------------------------------- */

            #error-overlay {
                display: none;
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                font-family: sans-serif;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 2rem;
                font-size: 1.25rem;
                z-index: 100;
            }
        </style>
    </head>
    <body>
        <!-- Small mode -->
        <div id="card-small">
            <div class="top">
                <div class="name" id="s-name"></div>
                <div class="wi" id="s-icon"></div>
            </div>
            <div class="temp-row">
                <div class="temp" id="s-temp"></div>
                <div class="hilo">
                    <div class="hi">&#8593;<span id="s-hi"></span></div>
                    <div class="lo">&#8595;<span id="s-lo"></span></div>
                </div>
            </div>
            <div class="facts">
                <div class="fact">
                    <div class="label">Precipitation</div>
                    <div class="value" id="s-precip"></div>
                </div>
                <div class="fact">
                    <div class="label">Wind</div>
                    <div class="value" id="s-wind"></div>
                </div>
            </div>
        </div>

        <!-- Medium mode -->
        <div id="card-medium">
            <div class="top">
                <div>
                    <div class="name" id="m-name"></div>
                    <div class="temp" id="m-temp"></div>
                </div>
                <div class="summary">
                    <div class="wi" id="m-icon"></div>
                    <div class="cond" id="m-cond"></div>
                    <div class="hilo" id="m-hilo"></div>
                </div>
            </div>
            <div class="hours" id="m-hours"></div>
        </div>

        <!-- Fullscreen mode -->
        <div id="screen-full">
            <div id="full-content">
                <div class="title">
                    <div class="name" id="f-name"></div>
                    <div class="sub" id="f-sub"></div>
                </div>
                <div class="panel">
                    <div class="panel-head">Conditions</div>
                    <div class="panel-sub" id="f-unit"></div>
                    <div class="hours" id="f-hours"></div>
                </div>
                <div class="panel" id="daily-panel"></div>
            </div>
        </div>

        <div id="error-overlay"></div>

        <!-- NOTE: plugin lives in weather/, SDK is at the repo root -->
        <script src="../plugin.js"></script>
        <script>
            (function () {
                'use strict';

                // ---------------------------------------------------------------
                // Config schema describes what the host should provide:
                //
                //   config.loc_latitude  (number, required) - the loc_
                //                         prefix keeps the pair adjacent in
                //                         alphabetised config forms
                //                         (latitude/longitude accepted as
                //                         legacy aliases)
                //   config.loc_longitude (number, required)
                //   config.display_name  (string, default '') - location name
                //                         shown on the widget (named so lat
                //                         and lon sort next to each other in
                //                         alphabetised config forms;
                //                         config.location_name is accepted
                //                         as a legacy alias)
                //   config.units         ('metric'|'imperial', default metric)
                //   config.timezone      (string, default 'auto') - IANA zone
                //                         passed to open-meteo; all displayed
                //                         times are in this zone
                //   config.mode          ('small'|'medium'|'fullscreen')
                //   config.size          (number) - card width in vmax for
                //                         small/medium modes (0 = automatic:
                //                         22 for small, 44 for medium)
                //   config.opacity       (number, default 62) - background
                //                         opacity percentage of the card
                //                         backing / fullscreen panels
                // ---------------------------------------------------------------

                var CONFIG_SCHEMA = {
                    type: 'object',
                    properties: {
                        loc_latitude: {
                            type: 'number',
                            title: 'Latitude',
                            description: 'Location latitude in degrees.',
                        },
                        loc_longitude: {
                            type: 'number',
                            title: 'Longitude',
                            description: 'Location longitude in degrees.',
                        },
                        display_name: {
                            type: 'string',
                            title: 'Location Name',
                            description:
                                'Display name shown on the widget (e.g. "Sydney").',
                            default: '',
                        },
                        units: {
                            type: 'string',
                            title: 'Units',
                            description:
                                'Measurement system for temperature and wind.',
                            default: 'metric',
                            enum: ['metric', 'imperial'],
                        },
                        timezone: {
                            type: 'string',
                            title: 'Timezone',
                            description:
                                'IANA timezone for displayed times (e.g. Australia/Sydney), or "auto" to use the location timezone.',
                            default: 'auto',
                        },
                        mode: {
                            type: 'string',
                            title: 'Mode',
                            description: 'Widget layout.',
                            default: 'medium',
                            enum: ['small', 'medium', 'fullscreen'],
                        },
                        size: {
                            type: 'number',
                            title: 'Size (vmax)',
                            description:
                                'Card width for small/medium modes as a percentage of the larger viewport dimension (0 = automatic).',
                            default: 0,
                        },
                        opacity: {
                            type: 'number',
                            title: 'Opacity (%)',
                            description:
                                'Background opacity of the card backing and fullscreen panels (0 - 100).',
                            default: 62,
                        },
                    },
                    required: ['loc_latitude', 'loc_longitude'],
                };

                var API_BASE = 'https://api.open-meteo.com/v1/forecast';
                var REFRESH_MS = 3 * 60 * 60 * 1000; // Fetch every 3 hours
                var RETRY_MS = 5 * 60 * 1000; // Retry failed fetches
                var TICK_MS = 60 * 1000; // Re-render every minute
                var STORAGE_PREFIX = 'weather-widget:';
                var HOURLY_SLOTS = 6;
                var RESIZE_DEBOUNCE_MS = 250;

                // Card width in em at font-size 1em (drives font scaling)
                var SMALL_EM = 13;
                var MEDIUM_EM = 30;
                var DEFAULT_SMALL_VMAX = 22;
                var DEFAULT_MEDIUM_VMAX = 44;

                var DAY_NAMES = [
                    'Sun',
                    'Mon',
                    'Tue',
                    'Wed',
                    'Thu',
                    'Fri',
                    'Sat',
                ];

                var activeConfig = {
                    latitude: null,
                    longitude: null,
                    locationName: '',
                    units: 'metric',
                    timezone: 'auto',
                    mode: 'medium',
                    size: 0,
                    opacity: 62,
                };

                var weather = null; // Latest API payload
                var hasRendered = false;
                var readyPending = false;
                var fetchSeq = 0;
                var refreshTimer = null;
                var tickTimer = null;
                var resizeTimer = null;

                var plugin = SignagePlugin.create({
                    plugin: {
                        name: 'weather',
                        version: '1.0.0',
                        type: 'widget',
                    },
                    capabilities: {
                        requires_play_signal: false,
                        can_finish: false,
                        static_media: false,
                    },
                    config_schema: CONFIG_SCHEMA,

                    onConfig: function (payload) {
                        var config = payload.config || {};

                        var lat =
                            typeof config.loc_latitude === 'number'
                                ? config.loc_latitude
                                : config.latitude;
                        var lon =
                            typeof config.loc_longitude === 'number'
                                ? config.loc_longitude
                                : config.longitude;
                        if (
                            typeof lat !== 'number' ||
                            !isFinite(lat) ||
                            typeof lon !== 'number' ||
                            !isFinite(lon)
                        ) {
                            // Fatal only when nothing is on screen yet - a
                            // bad config pushed to a running widget keeps
                            // the current weather showing
                            plugin.error({
                                code: 'MISSING_COORDS',
                                message:
                                    'config.loc_latitude and config.loc_longitude are required numbers.',
                                fatal: !hasRendered,
                            });
                            if (!hasRendered) {
                                showError('Missing latitude / longitude');
                            }
                            return;
                        }

                        activeConfig.latitude = lat;
                        activeConfig.longitude = lon;
                        activeConfig.locationName =
                            typeof config.display_name === 'string'
                                ? config.display_name
                                : typeof config.location_name === 'string'
                                  ? config.location_name
                                  : '';
                        activeConfig.units =
                            config.units === 'imperial' ? 'imperial' : 'metric';
                        activeConfig.timezone =
                            typeof config.timezone === 'string' &&
                            config.timezone
                                ? config.timezone
                                : 'auto';
                        activeConfig.mode =
                            config.mode === 'small' ||
                            config.mode === 'fullscreen'
                                ? config.mode
                                : 'medium';
                        activeConfig.size = clampNumber(config.size, 0, 100, 0);
                        activeConfig.opacity = clampNumber(
                            config.opacity,
                            0,
                            100,
                            62,
                        );

                        // Backing opacity: the fullscreen panels keep their
                        // softer ratio relative to the card backing
                        var rootStyle = document.documentElement.style;
                        rootStyle.setProperty(
                            '--card-alpha',
                            String(activeConfig.opacity / 100),
                        );
                        rootStyle.setProperty(
                            '--card-soft-alpha',
                            String((activeConfig.opacity / 100) * 0.73),
                        );

                        document.body.className = 'mode-' + activeConfig.mode;
                        applySizing();
                        hideError();
                        readyPending = true;

                        // Serve from cache when fresh; (re)fetch otherwise.
                        // A newer config invalidates in-flight responses.
                        fetchSeq++;
                        if (refreshTimer !== null) {
                            clearTimeout(refreshTimer);
                            refreshTimer = null;
                        }
                        var cached = loadCache();
                        if (cached) {
                            weather = cached.payload;
                            renderAll();
                            scheduleRefresh(
                                cached.fetched_at + REFRESH_MS - Date.now(),
                            );
                        } else {
                            fetchWeather();
                        }
                        startTicking();
                    },

                    onPlay: function () {
                        // Rendering is driven by config + timers; nothing to
                        // start on play
                    },
                });

                // ---------------------------------------------------------------
                // Fetching and caching
                // ---------------------------------------------------------------

                /**
                 * Cache key for the current location/unit/timezone settings.
                 *
                 * @returns {string}
                 */
                function cacheKey() {
                    return (
                        STORAGE_PREFIX +
                        activeConfig.latitude +
                        ',' +
                        activeConfig.longitude +
                        ',' +
                        activeConfig.units +
                        ',' +
                        activeConfig.timezone
                    );
                }

                /**
                 * Load a fresh (younger than the refresh interval) cached
                 * payload for the current settings, if one exists.
                 *
                 * @returns {{fetched_at: number, payload: object}|null}
                 */
                function loadCache() {
                    try {
                        var raw = window.localStorage.getItem(cacheKey());
                        if (!raw) {
                            return null;
                        }
                        var entry = JSON.parse(raw);
                        if (
                            !entry ||
                            typeof entry.fetched_at !== 'number' ||
                            !entry.payload
                        ) {
                            return null;
                        }
                        if (Date.now() - entry.fetched_at >= REFRESH_MS) {
                            return null;
                        }
                        return entry;
                    } catch (e) {
                        return null;
                    }
                }

                function saveCache(payload) {
                    try {
                        window.localStorage.setItem(
                            cacheKey(),
                            JSON.stringify({
                                fetched_at: Date.now(),
                                payload: payload,
                            }),
                        );
                    } catch (e) {
                        /* Ignore - storage unavailable */
                    }
                }

                /**
                 * Build the open-meteo request URL for the active config.
                 *
                 * @returns {string}
                 */
                function buildUrl() {
                    var imperial = activeConfig.units === 'imperial';
                    return (
                        API_BASE +
                        '?latitude=' +
                        encodeURIComponent(activeConfig.latitude) +
                        '&longitude=' +
                        encodeURIComponent(activeConfig.longitude) +
                        '&current=temperature_2m,apparent_temperature,' +
                        'relative_humidity_2m,weather_code,wind_speed_10m,is_day' +
                        '&hourly=temperature_2m,apparent_temperature,' +
                        'weather_code,is_day,precipitation_probability' +
                        '&daily=weather_code,temperature_2m_max,' +
                        'temperature_2m_min,precipitation_probability_max' +
                        '&forecast_days=7' +
                        '&timezone=' +
                        encodeURIComponent(activeConfig.timezone) +
                        (imperial
                            ? '&temperature_unit=fahrenheit&wind_speed_unit=mph'
                            : '&wind_speed_unit=kmh')
                    );
                }

                function fetchWeather() {
                    var seq = fetchSeq;
                    var xhr = new XMLHttpRequest();
                    xhr.open('GET', buildUrl(), true);

                    xhr.onload = function () {
                        if (seq !== fetchSeq) {
                            return; // Superseded by a newer config
                        }
                        if (xhr.status < 200 || xhr.status >= 300) {
                            handleFetchFailure(
                                'Forecast request returned HTTP ' + xhr.status,
                            );
                            return;
                        }
                        var payload = null;
                        try {
                            payload = JSON.parse(xhr.responseText);
                        } catch (e) {
                            payload = null;
                        }
                        if (
                            !payload ||
                            !payload.hourly ||
                            !payload.daily ||
                            !payload.current
                        ) {
                            handleFetchFailure(
                                'Forecast response was not the expected JSON shape.',
                            );
                            return;
                        }
                        weather = payload;
                        saveCache(payload);
                        renderAll();
                        scheduleRefresh(REFRESH_MS);
                    };

                    xhr.onerror = function () {
                        if (seq !== fetchSeq) {
                            return;
                        }
                        handleFetchFailure(
                            'Forecast request failed (network error).',
                        );
                    };

                    xhr.send();
                }

                function handleFetchFailure(message) {
                    plugin.error({
                        code: 'FORECAST_FETCH_FAILED',
                        message: message,
                        fatal: !hasRendered,
                        details: { latitude: activeConfig.latitude },
                    });
                    if (!hasRendered) {
                        showError('Unable to load weather data');
                    }
                    // Keep showing whatever we have (even a stale cache
                    // beats a blank screen) and retry
                    scheduleRefresh(RETRY_MS);
                }

                function scheduleRefresh(delayMs) {
                    if (refreshTimer !== null) {
                        clearTimeout(refreshTimer);
                    }
                    refreshTimer = setTimeout(
                        fetchWeather,
                        Math.max(5000, delayMs),
                    );
                }

                function startTicking() {
                    if (tickTimer !== null) {
                        return;
                    }
                    tickTimer = setInterval(function () {
                        if (!document.hidden && weather) {
                            renderAll();
                        }
                    }, TICK_MS);
                }

                // ---------------------------------------------------------------
                // Time helpers - all in the forecast's configured timezone
                // ---------------------------------------------------------------

                /**
                 * Current time as milliseconds shifted into the forecast's
                 * timezone, comparable with parseLocal() results.
                 *
                 * @returns {number}
                 */
                function zoneNow() {
                    var offset =
                        weather && weather.utc_offset_seconds
                            ? weather.utc_offset_seconds
                            : 0;
                    return Date.now() + offset * 1000;
                }

                /**
                 * Parse an open-meteo local ISO time ("2026-09-21T14:00" or
                 * "2026-09-21") as shifted milliseconds.
                 *
                 * @param {string} iso
                 * @returns {number}
                 */
                function parseLocal(iso) {
                    if (iso.length === 10) {
                        iso += 'T00:00';
                    }
                    return Date.parse(iso + ':00Z');
                }

                /**
                 * Index of the hourly slot containing the given time plus
                 * the fraction of the hour elapsed within it.
                 *
                 * @param {number} now - Shifted milliseconds
                 * @returns {{index: number, frac: number}}
                 */
                function hourPosition(now) {
                    var times = weather.hourly.time;
                    var i;
                    for (i = times.length - 1; i >= 0; i--) {
                        var t = parseLocal(times[i]);
                        if (t <= now) {
                            return {
                                index: i,
                                frac: Math.min(1, (now - t) / 3600000),
                            };
                        }
                    }
                    return { index: 0, frac: 0 };
                }

                /**
                 * Linearly interpolate an hourly series at the current
                 * position - at half past the hour this is the average of
                 * the two bounding hours.
                 *
                 * @param {Array<number>} series
                 * @param {{index: number, frac: number}} pos
                 * @returns {number}
                 */
                function interpolate(series, pos) {
                    var a = series[pos.index];
                    var b =
                        pos.index + 1 < series.length
                            ? series[pos.index + 1]
                            : a;
                    if (typeof a !== 'number') {
                        return typeof b === 'number' ? b : 0;
                    }
                    if (typeof b !== 'number') {
                        return a;
                    }
                    return a + (b - a) * pos.frac;
                }

                /**
                 * "2 PM" style label for a shifted milliseconds value.
                 *
                 * @param {number} ms
                 * @returns {string}
                 */
                function hourLabel(ms) {
                    var h = new Date(ms).getUTCHours();
                    var twelve = h % 12 === 0 ? 12 : h % 12;
                    return twelve + ' ' + (h < 12 ? 'AM' : 'PM');
                }

                // ---------------------------------------------------------------
                // Weather code mapping (WMO codes from open-meteo)
                // ---------------------------------------------------------------

                /**
                 * Map a WMO weather code to an icon key.
                 *
                 * @param {number} code
                 * @param {boolean} isDay
                 * @returns {string}
                 */
                function iconFor(code, isDay) {
                    if (code === 0 || code === 1) {
                        return isDay ? 'sun' : 'moon';
                    }
                    if (code === 2) {
                        return isDay ? 'partlyday' : 'partlynight';
                    }
                    if (code === 3) {
                        return isDay ? 'clouds' : 'cloudnight';
                    }
                    if (code === 45 || code === 48) {
                        return isDay ? 'fogday' : 'fognight';
                    }
                    if (code >= 71 && code <= 77) {
                        return isDay ? 'snow' : 'snownight';
                    }
                    if (code === 85 || code === 86) {
                        return isDay ? 'snow' : 'snownight';
                    }
                    if (code >= 95) {
                        return isDay ? 'thunderday' : 'thundernight';
                    }
                    if (code >= 51) {
                        return isDay ? 'rain' : 'rainnight';
                    }
                    return isDay ? 'clouds' : 'cloudnight';
                }

                /**
                 * Human-readable condition for a WMO weather code.
                 *
                 * @param {number} code
                 * @returns {string}
                 */
                function conditionFor(code) {
                    if (code === 0) {
                        return 'Clear';
                    }
                    if (code === 1) {
                        return 'Mostly Clear';
                    }
                    if (code === 2) {
                        return 'Partly Cloudy';
                    }
                    if (code === 3) {
                        return 'Cloudy';
                    }
                    if (code === 45 || code === 48) {
                        return 'Fog';
                    }
                    if (code >= 51 && code <= 57) {
                        return 'Drizzle';
                    }
                    if (code >= 61 && code <= 67) {
                        return 'Rain';
                    }
                    if (code >= 71 && code <= 77) {
                        return 'Snow';
                    }
                    if (code >= 80 && code <= 82) {
                        return 'Showers';
                    }
                    if (code === 85 || code === 86) {
                        return 'Snow Showers';
                    }
                    if (code >= 95) {
                        return 'Thunderstorm';
                    }
                    return 'Cloudy';
                }

                /**
                 * Fullscreen background class for a WMO code.
                 *
                 * @param {number} code
                 * @param {boolean} isDay
                 * @returns {string}
                 */
                function backgroundFor(code, isDay) {
                    if (!isDay) {
                        return 'bg-night';
                    }
                    if (code <= 2) {
                        return 'bg-day';
                    }
                    if (code >= 51 && code <= 67) {
                        return 'bg-rain';
                    }
                    if (code >= 80 && code <= 82) {
                        return 'bg-rain';
                    }
                    if (code >= 95) {
                        return 'bg-rain';
                    }
                    return 'bg-cloud';
                }

                /**
                 * CSS colour for a temperature (cold blue through hot
                 * orange), used by the daily range bars.
                 *
                 * @param {number} temp - In the configured units
                 * @returns {string}
                 */
                function tempColor(temp) {
                    var celsius =
                        activeConfig.units === 'imperial'
                            ? ((temp - 32) * 5) / 9
                            : temp;
                    var ratio = (celsius - 0) / 35;
                    if (ratio < 0) {
                        ratio = 0;
                    }
                    if (ratio > 1) {
                        ratio = 1;
                    }
                    var hue = Math.round(210 - ratio * 190);
                    return 'hsl(' + hue + ', 85%, 60%)';
                }

                // ---------------------------------------------------------------
                // Rendering
                // ---------------------------------------------------------------

                function degrees(value) {
                    return Math.round(value) + '°';
                }

                /**
                 * Compute the current display model from the cached payload
                 * (interpolated to the current minute) and render whichever
                 * mode is active.
                 */
                function renderAll() {
                    if (!weather) {
                        return;
                    }
                    var now = zoneNow();
                    var pos = hourPosition(now);
                    var hourly = weather.hourly;
                    var daily = weather.daily;

                    // Interpolated "right now" values
                    var temp = interpolate(hourly.temperature_2m, pos);
                    var feels = interpolate(hourly.apparent_temperature, pos);
                    var nearest = pos.frac < 0.5 ? pos.index : pos.index + 1;
                    if (nearest >= hourly.weather_code.length) {
                        nearest = hourly.weather_code.length - 1;
                    }
                    var code = hourly.weather_code[nearest];
                    var isDay = hourly.is_day[nearest] === 1;

                    // Today's daily row (dates are in the forecast zone)
                    var todayIso = new Date(now).toISOString().slice(0, 10);
                    var todayIndex = daily.time.indexOf(todayIso);
                    if (todayIndex < 0) {
                        todayIndex = 0;
                    }
                    var hi = daily.temperature_2m_max[todayIndex];
                    var lo = daily.temperature_2m_min[todayIndex];

                    var name = activeConfig.locationName;
                    var mode = activeConfig.mode;

                    if (mode === 'small') {
                        renderSmall(
                            name,
                            temp,
                            hi,
                            lo,
                            code,
                            isDay,
                            todayIndex,
                        );
                    } else if (mode === 'medium') {
                        renderMedium(name, temp, hi, lo, code, isDay, pos, now);
                    } else {
                        renderFull(
                            name,
                            temp,
                            feels,
                            hi,
                            lo,
                            code,
                            isDay,
                            pos,
                            now,
                            todayIndex,
                        );
                    }

                    // Re-apply sizing: the parent page may have resized
                    // (its dimensions are only observable by polling)
                    applySizing();

                    hasRendered = true;
                    hideError();
                    if (readyPending) {
                        readyPending = false;
                        plugin.ready();
                    }
                }

                function setIcon(el, key) {
                    el.className = el.className
                        .replace(/\bwi-[a-z]+/g, '')
                        .replace(/\s+/g, ' ');
                    el.className += ' wi-' + key;
                }

                function renderSmall(
                    name,
                    temp,
                    hi,
                    lo,
                    code,
                    isDay,
                    todayIndex,
                ) {
                    text('s-name', name);
                    text('s-temp', degrees(temp));
                    text('s-hi', degrees(hi));
                    text('s-lo', degrees(lo));
                    setIcon(
                        document.getElementById('s-icon'),
                        iconFor(code, isDay),
                    );

                    // Next precipitation: first day with a meaningful chance
                    var daily = weather.daily;
                    var probs = daily.precipitation_probability_max || [];
                    var precip = null;
                    var i;
                    for (i = todayIndex; i < probs.length; i++) {
                        if (typeof probs[i] === 'number' && probs[i] >= 30) {
                            precip =
                                i === todayIndex
                                    ? probs[i] + '% today'
                                    : probs[i] +
                                      '% ' +
                                      dayName(daily.time[i], i - todayIndex);
                            break;
                        }
                    }
                    if (precip === null) {
                        precip =
                            'None for ' + (probs.length - todayIndex) + 'd';
                    }
                    text('s-precip', precip);

                    var wind = weather.current.wind_speed_10m;
                    text(
                        's-wind',
                        Math.round(wind) +
                            ' ' +
                            (activeConfig.units === 'imperial'
                                ? 'mph'
                                : 'km/h'),
                    );
                }

                function renderMedium(
                    name,
                    temp,
                    hi,
                    lo,
                    code,
                    isDay,
                    pos,
                    now,
                ) {
                    text('m-name', name);
                    text('m-temp', degrees(temp));
                    text('m-cond', conditionFor(code));
                    text('m-hilo', 'H:' + degrees(hi) + ' L:' + degrees(lo));
                    setIcon(
                        document.getElementById('m-icon'),
                        iconFor(code, isDay),
                    );
                    buildHours(
                        document.getElementById('m-hours'),
                        temp,
                        code,
                        isDay,
                        pos,
                    );
                }

                function renderFull(
                    name,
                    temp,
                    feels,
                    hi,
                    lo,
                    code,
                    isDay,
                    pos,
                    now,
                    todayIndex,
                ) {
                    var full = document.getElementById('screen-full');
                    full.className = backgroundFor(code, isDay);

                    text('f-name', name);
                    text(
                        'f-sub',
                        degrees(temp) + '  |  Feels Like: ' + degrees(feels),
                    );
                    text(
                        'f-unit',
                        'Temperature (°' +
                            (activeConfig.units === 'imperial' ? 'F' : 'C') +
                            ')',
                    );
                    buildHours(
                        document.getElementById('f-hours'),
                        temp,
                        code,
                        isDay,
                        pos,
                    );
                    buildDaily(todayIndex, temp);
                }

                /**
                 * Fill an hourly strip: "Now" plus the next five full hours.
                 *
                 * @param {Element} container
                 * @param {number} temp - Interpolated current temperature
                 * @param {number} code - Current weather code
                 * @param {boolean} isDay
                 * @param {{index: number, frac: number}} pos
                 */
                function buildHours(container, temp, code, isDay, pos) {
                    var hourly = weather.hourly;
                    container.innerHTML = '';
                    var slot;
                    for (slot = 0; slot < HOURLY_SLOTS; slot++) {
                        var cell = document.createElement('div');
                        cell.className = 'hour';

                        var when = document.createElement('div');
                        when.className = 'when';
                        var icon = document.createElement('div');
                        icon.className = 'wi';
                        var t = document.createElement('div');
                        t.className = 't';

                        if (slot === 0) {
                            when.textContent = 'Now';
                            setIcon(icon, iconFor(code, isDay));
                            t.textContent = degrees(temp);
                        } else {
                            var idx = pos.index + slot;
                            if (idx >= hourly.time.length) {
                                break;
                            }
                            when.textContent = hourLabel(
                                parseLocal(hourly.time[idx]),
                            );
                            setIcon(
                                icon,
                                iconFor(
                                    hourly.weather_code[idx],
                                    hourly.is_day[idx] === 1,
                                ),
                            );
                            t.textContent = degrees(hourly.temperature_2m[idx]);
                        }

                        cell.appendChild(when);
                        cell.appendChild(icon);
                        cell.appendChild(t);
                        container.appendChild(cell);
                    }
                }

                /**
                 * Build the seven-day forecast rows with temperature range
                 * bars spanning the week's overall min/max.
                 *
                 * @param {number} todayIndex
                 * @param {number} temp - Interpolated current temperature
                 */
                function buildDaily(todayIndex, temp) {
                    var daily = weather.daily;
                    var panel = document.getElementById('daily-panel');
                    panel.innerHTML = '';

                    var mins = daily.temperature_2m_min;
                    var maxes = daily.temperature_2m_max;
                    var globalMin = Infinity;
                    var globalMax = -Infinity;
                    var i;
                    for (i = 0; i < mins.length; i++) {
                        if (mins[i] < globalMin) {
                            globalMin = mins[i];
                        }
                        if (maxes[i] > globalMax) {
                            globalMax = maxes[i];
                        }
                    }
                    var span = globalMax - globalMin || 1;

                    for (i = 0; i < daily.time.length; i++) {
                        var row = document.createElement('div');
                        row.className = 'day-row';

                        var d = document.createElement('div');
                        d.className = 'd';
                        d.textContent =
                            i === todayIndex
                                ? 'Today'
                                : dayName(daily.time[i], i - todayIndex);

                        var cond = document.createElement('div');
                        cond.className = 'cond';
                        var icon = document.createElement('div');
                        icon.className = 'wi';
                        setIcon(icon, iconFor(daily.weather_code[i], true));
                        cond.appendChild(icon);
                        var prob = (daily.precipitation_probability_max || [])[
                            i
                        ];
                        if (typeof prob === 'number' && prob >= 30) {
                            var pp = document.createElement('div');
                            pp.className = 'pp';
                            pp.textContent = prob + '%';
                            cond.appendChild(pp);
                        }

                        var lo = document.createElement('div');
                        lo.className = 'lo';
                        lo.textContent = degrees(mins[i]);

                        var range = document.createElement('div');
                        range.className = 'range';
                        var bar = document.createElement('div');
                        bar.className = 'bar';
                        var left = ((mins[i] - globalMin) / span) * 100;
                        var width = ((maxes[i] - mins[i]) / span) * 100;
                        bar.style.left = left + '%';
                        bar.style.width = Math.max(4, width) + '%';
                        bar.style.background =
                            'linear-gradient(90deg, ' +
                            tempColor(mins[i]) +
                            ', ' +
                            tempColor(maxes[i]) +
                            ')';
                        range.appendChild(bar);

                        if (i === todayIndex) {
                            var dot = document.createElement('div');
                            dot.className = 'dot';
                            var frac = (temp - globalMin) / span;
                            if (frac < 0) {
                                frac = 0;
                            }
                            if (frac > 1) {
                                frac = 1;
                            }
                            dot.style.left = frac * 100 + '%';
                            range.appendChild(dot);
                        }

                        var hi = document.createElement('div');
                        hi.className = 'hi';
                        hi.textContent = degrees(maxes[i]);

                        row.appendChild(d);
                        row.appendChild(cond);
                        row.appendChild(lo);
                        row.appendChild(range);
                        row.appendChild(hi);
                        panel.appendChild(row);
                    }
                }

                /**
                 * Weekday name for a daily ISO date.
                 *
                 * @param {string} iso - "2026-09-21"
                 * @returns {string}
                 */
                function dayName(iso) {
                    return DAY_NAMES[new Date(parseLocal(iso)).getUTCDay()];
                }

                function text(id, value) {
                    document.getElementById(id).textContent = value;
                }

                // ---------------------------------------------------------------
                // Sizing
                // ---------------------------------------------------------------

                /**
                 * Set the mode container's font size so the card occupies
                 * the configured vmax width (small/medium) or scales with
                 * the viewport (fullscreen).
                 */
                /**
                 * The larger dimension of the BASE PAGE, not this iframe.
                 * The host may crop or move the iframe anywhere on the
                 * page; sizing against the same-origin parent keeps the
                 * card the same size wherever the iframe is placed. Falls
                 * back to this iframe's own viewport when the parent is
                 * cross-origin or absent.
                 *
                 * @returns {number}
                 */
                function pageVmax() {
                    try {
                        if (
                            window.parent &&
                            window.parent !== window &&
                            window.parent.innerWidth
                        ) {
                            return Math.max(
                                window.parent.innerWidth,
                                window.parent.innerHeight,
                            );
                        }
                    } catch (e) {
                        /* Ignore - cross-origin parent */
                    }
                    return Math.max(window.innerWidth, window.innerHeight);
                }

                function applySizing() {
                    var vmin = Math.min(window.innerWidth, window.innerHeight);
                    var vmax = pageVmax();

                    var smallSize =
                        activeConfig.size > 0
                            ? activeConfig.size
                            : DEFAULT_SMALL_VMAX;
                    var mediumSize =
                        activeConfig.size > 0
                            ? activeConfig.size
                            : DEFAULT_MEDIUM_VMAX;

                    document.getElementById('card-small').style.fontSize =
                        (vmax * smallSize) / 100 / SMALL_EM + 'px';
                    document.getElementById('card-medium').style.fontSize =
                        (vmax * mediumSize) / 100 / MEDIUM_EM + 'px';
                    // Height budget: the fullscreen column is ~40em tall
                    document.getElementById('screen-full').style.fontSize =
                        Math.min(vmin / 34, window.innerHeight / 46) + 'px';
                }

                window.addEventListener('resize', function () {
                    if (resizeTimer !== null) {
                        clearTimeout(resizeTimer);
                    }
                    resizeTimer = setTimeout(function () {
                        resizeTimer = null;
                        applySizing();
                    }, RESIZE_DEBOUNCE_MS);
                });

                document.addEventListener('visibilitychange', function () {
                    if (!document.hidden && weather) {
                        renderAll();
                    }
                });

                applySizing();

                // ---------------------------------------------------------------
                // Helpers
                // ---------------------------------------------------------------

                /**
                 * Clamp a numeric config value, falling back when missing or
                 * not a finite number.
                 *
                 * @param {*} value - Raw config value
                 * @param {number} min - Minimum allowed value
                 * @param {number} max - Maximum allowed value
                 * @param {number} fallback - Default when invalid
                 * @returns {number}
                 */
                function clampNumber(value, min, max, fallback) {
                    if (typeof value !== 'number' || !isFinite(value)) {
                        return fallback;
                    }
                    return Math.max(min, Math.min(max, value));
                }

                /**
                 * Display an error message overlay.
                 */
                function showError(message) {
                    var overlay = document.getElementById('error-overlay');
                    if (overlay) {
                        overlay.textContent = message;
                        overlay.style.display = 'flex';
                    }
                }

                function hideError() {
                    var overlay = document.getElementById('error-overlay');
                    if (overlay) {
                        overlay.style.display = 'none';
                    }
                }
            })();
        </script>
    </body>
</html>
