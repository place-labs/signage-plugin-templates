<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rain Overlay Plugin</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            /* NOTE: this plugin is a fullscreen overlay iframe positioned above
               other content, so the background must stay fully transparent.
               The host should also set pointer-events: none on the iframe so
               clicks pass through to the page underneath, and include
               allow="display-capture" on the iframe so real-time tab capture
               is permitted. */
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
            }
            #rain-canvas {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                display: block;
            }
            #error-overlay {
                display: none;
                position: absolute;
                inset: 0;
                background: rgba(0, 0, 0, 0.85);
                color: #fff;
                font-family: sans-serif;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 2rem;
                font-size: 1.25rem;
                z-index: 10;
            }
        </style>
    </head>
    <body>
        <canvas id="rain-canvas"></canvas>
        <div id="error-overlay"></div>

        <script src="../plugin.js"></script>
        <script>
            (function () {
                'use strict';

                // ---------------------------------------------------------------
                // Rain-on-glass overlay.
                //
                // Renders animated raindrops that refract the page rendered
                // underneath this iframe. Pixels without drops are output
                // with alpha 0 so the page shows through.
                //
                // The refraction texture is a real-time mirror of the base
                // page, captured one of two ways:
                //
                //   display - getDisplayMedia tab self-capture: a true
                //             compositor feed of the page (video, CSS
                //             animations, WebGL - everything) at full frame
                //             rate. Needs the browser to grant tab capture
                //             (kiosk policy or user approval).
                //   dom     - same-origin parent DOM mirroring: a periodic
                //             SVG foreignObject snapshot for static content,
                //             plus per-frame copies of live <video>/<canvas>
                //             elements. No permissions needed, but CSS
                //             animations only update at the snapshot rate.
                //
                // Drop simulation and refraction shader adapted from
                // "Rain & Water Effect Experiments" by Lucas Bebber (Codrops):
                //   https://github.com/codrops/RainEffect
                //   License: http://tympanus.net/codrops/licensing/
                // ---------------------------------------------------------------

                var CONFIG_SCHEMA = {
                    type: 'object',
                    properties: {
                        intensity: {
                            type: 'number',
                            title: 'Rain Intensity',
                            description:
                                'How heavy the rain is, from 0 (light drizzle) to 1 (downpour).',
                            default: 0.5,
                            minimum: 0,
                            maximum: 1,
                        },
                        capture_mode: {
                            type: 'string',
                            title: 'Capture Mode',
                            description:
                                'How the base page is captured for refraction: "display" uses real-time tab capture via getDisplayMedia (requires a kiosk policy or user approval), "dom" mirrors the parent DOM with periodic snapshots, "auto" tries display capture and falls back to dom.',
                            default: 'auto',
                            enum: ['auto', 'display', 'dom'],
                        },
                        snapshot_interval: {
                            type: 'number',
                            title: 'Snapshot Interval (seconds)',
                            description:
                                'How often the base page DOM is re-captured in dom capture mode. Live video and canvas elements are mirrored every frame regardless. Ignored while display capture is active.',
                            default: 10,
                            minimum: 0.25,
                            maximum: 300,
                        },
                        background_selector: {
                            type: 'string',
                            title: 'Background Selector',
                            description:
                                'Optional CSS selector for the element in the base page to mirror. Defaults to the whole page body.',
                        },
                        fallback_color: {
                            type: 'string',
                            title: 'Fallback Colour',

                };

                /**
                 * Collect the text of every readable stylesheet in the parent
                 * document so the snapshot lays out with the page's styles.
                 *
                 * @returns {string} Combined CSS text
                 */
                PageMirror.prototype.collectStyles = function () {
                    var css = '';
                    var sheets = this.parentDoc.styleSheets;
                    for (var i = 0; i < sheets.length; i++) {
                        try {
                            var rules = sheets[i].cssRules;
                            if (!rules) continue;
                            for (var j = 0; j < rules.length; j++) {
                                css += rules[j].cssText + '\n';
                            }
                        } catch (e) {
                            /* Cross-origin stylesheet - skip */
                        }
                    }
                    return css;
                };

                /**
                 * Rasterise the parent DOM into the static layer via an SVG
                 * foreignObject image. Runs asynchronously; failures leave the
                 * previous static layer in place.
                 */
                PageMirror.prototype.snapshot = function () {
                    if (!this.available || this.snapshotPending) return;
                    this.snapshotPending = true;
                    this.lastSnapshot = Date.now();

                    var self = this;
                    var pw = this.parentWin.innerWidth;
                    var ph = this.parentWin.innerHeight;

                    this.pageColor = this.resolvePageColor();

                    var svg;
                    try {
                        var root = this.root();
                        var clone = root.cloneNode(true);

                        // Inline same-origin images; clone order matches the
                        // original so the lists correspond by index
                        var origImgs = root.querySelectorAll('img');
                        var cloneImgs = clone.querySelectorAll('img');
                        for (var i = 0; i < cloneImgs.length; i++) {
                            var dataUri =
                                i < origImgs.length
                                    ? this.inlineImage(origImgs[i])
                                    : null;
                            if (dataUri) {
                                cloneImgs[i].setAttribute('src', dataUri);
                                cloneImgs[i].removeAttribute('srcset');
                            } else if (cloneImgs[i].parentNode) {
                                cloneImgs[i].parentNode.removeChild(
                                    cloneImgs[i],
                                );
                            }
                        }

                        // Strip what cannot (or must not) rasterise: scripts,
                        // iframes (including this overlay) and the live
                        // video/canvas elements drawn separately each frame
                        var strip = clone.querySelectorAll(
                            'script, iframe, video, canvas, noscript',
                        );
                        for (var k = 0; k < strip.length; k++) {
                            if (strip[k].parentNode) {
                                strip[k].parentNode.removeChild(strip[k]);
                            }
                        }

                        clone.style.width = pw + 'px';
                        clone.style.height = ph + 'px';
                        clone.style.margin = '0';

                        var container = this.parentDoc.createElement('div');
                        var styleEl = this.parentDoc.createElement('style');
                        styleEl.textContent = this.collectStyles();
                        container.appendChild(styleEl);
                        container.appendChild(clone);

                        var markup = new XMLSerializer().serializeToString(
                            container,
                        );
                        svg =
                            '<svg xmlns="http://www.w3.org/2000/svg" width="' +
                            pw +
                            '" height="' +
                            ph +
                            '"><foreignObject width="100%" height="100%">' +
                            markup +
                            '</foreignObject></svg>';
                    } catch (e) {
                        this.snapshotPending = false;
                        return;
                    }

                    // NOTE: must be a data URI - Chrome taints canvases drawn
                    // from blob: SVG images, but not from data: SVG images
                    var url =
                        'data:image/svg+xml;charset=utf-8,' +
                        encodeURIComponent(svg);
                    var image = new Image();

                    image.onload = function () {
                        self.staticCtx.clearRect(0, 0, self.width, self.height);
                        self.staticCtx.drawImage(
                            image,
                            0,
                            0,
                            self.width,
                            self.height,
                        );
                        self.hasStatic = true;
                        self.staticDirty = true;
                        self.snapshotPending = false;
                    };
                    image.onerror = function () {
                        self.snapshotPending = false;
                    };
                    image.src = url;
                };

                /**
                 * Refresh the list of live parent elements mirrored per frame.
                 */
                PageMirror.prototype.refreshLiveElements = function () {
                    if (!this.available || this.liveBlocked) {
                        this.liveElements = [];
                        return;
                    }
                    var found = this.root().querySelectorAll('video, canvas');
                    var next = [];
                    for (var i = 0; i < found.length; i++) {
                        next.push(found[i]);
                        // New element - retest the canvas for tainting after
                        // the next compose
                        if (this.liveElements.indexOf(found[i]) === -1) {
                            this.taintTested = false;
                        }
                    }
                    this.liveElements = next;
                };

                /**
                 * Draw one frame of the mirror.
                 *
                 * @returns {boolean} true if the mirror canvas changed
                 */
                PageMirror.prototype.update = function () {
                    // Real-time compositor feed - preferred whenever active
                    if (DisplayCapture.ready()) {
                        this.ctx.globalCompositeOperation = 'source-over';
                        this.ctx.drawImage(
                            DisplayCapture.video,
                            0,
                            0,
                            this.width,
                            this.height,
                        );
                        // Recompose DOM layers promptly if capture ends later
                        this.staticDirty = true;
                        return true;
                    }

                    if (!this.available) {
                        if (this.staticDirty) {
                            this.compose();
                            this.staticDirty = false;
                            return true;
                        }
                        return false;
                    }

                    if (
                        Date.now() - this.lastSnapshot >
                        this.snapshotIntervalMs
                    ) {
                        this.snapshot();
                        this.refreshLiveElements();
                    }

                    var hasLive =
                        !this.liveBlocked && this.liveElements.length > 0;
                    if (!hasLive && !this.staticDirty) {
                        return false;
                    }
                    this.staticDirty = false;

                    this.compose();

                    if (hasLive && !this.taintTested) {
                        this.taintTest();
                    }
                    return true;
                };

                PageMirror.prototype.compose = function () {
                    var ctx = this.ctx;
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.fillStyle = this.pageColor || this.fallbackColor;
                    ctx.fillRect(0, 0, this.width, this.height);

                    if (this.hasStatic) {
                        ctx.drawImage(
                            this.staticCanvas,
                            0,
                            0,
                            this.width,
                            this.height,
                        );
                    }

                    if (this.liveBlocked || !this.available) return;

                    var scaleX = this.width / this.parentWin.innerWidth;
                    var scaleY = this.height / this.parentWin.innerHeight;
                    for (var i = 0; i < this.liveElements.length; i++) {
                        var el = this.liveElements[i];
                        if (
                            el.tagName === 'VIDEO' &&
                            el.readyState < 2 // HAVE_CURRENT_DATA
                        ) {
                            continue;
                        }
                        try {
                            var rect = el.getBoundingClientRect();
                            if (rect.width === 0 || rect.height === 0) {
                                continue;
                            }
                            ctx.drawImage(
                                el,
                                rect.left * scaleX,
                                rect.top * scaleY,
                                rect.width * scaleX,
                                rect.height * scaleY,
                            );
                        } catch (e) {
                            /* Ignore - element not drawable this frame */
                        }
                    }
                };

                /**
                 * Drawing a cross-origin video (or a canvas that itself is
                 * tainted) silently taints the mirror, which would then fail
                 * to upload as a WebGL texture. Detect it once per live
                 * element set and, if tainted, permanently disable the live
                 * layer and rebuild clean canvases.
                 */
                PageMirror.prototype.taintTest = function () {
                    this.taintTested = true;
                    try {
                        this.ctx.getImageData(0, 0, 1, 1);
                    } catch (e) {
                        this.blockLive();
                    }
                };

                PageMirror.prototype.blockLive = function () {
                    // A tainted canvas cannot be cleaned - recreate both
                    // layers so the mirror is guaranteed uploadable again
                    this.liveBlocked = true;
                    this.liveElements = [];
                    this.canvas = createCanvas(this.width, this.height);
                    this.ctx = this.canvas.getContext('2d');
                    this.staticCanvas = createCanvas(this.width, this.height);
                    this.staticCtx = this.staticCanvas.getContext('2d');
                    this.hasStatic = false;
                    this.staticDirty = true;
                    this.compose();
                };

                // ---------------------------------------------------------------
                // Plugin state
                // ---------------------------------------------------------------

                var dropAlpha = null;
                var dropColor = null;
                var texturesLoading = false;
                var pendingConfig = null;

                var canvas = document.getElementById('rain-canvas');
                var raindrops = null;
                var renderer = null;
                var mirror = null;
                var rafId = null;
                var playing = false;
                var built = false;
                var activeConfig = null;
                var resizeTimer = null;
                var taintReported = false;
                var displayFailReported = false;
                var displayRetryArmed = false;

                var plugin = SignagePlugin.create({
                    plugin: {
                        name: 'rain-overlay',
                        version: '1.1.0',
                        type: 'widget',
                    },
                    capabilities: {
                        requires_play_signal: true,
                        can_finish: false,
                        static_media: false,
                    },
                    config_schema: CONFIG_SCHEMA,

                    onConfig: function (payload) {
                        var config = payload.config || {};

                        activeConfig = {
                            intensity: clamp(
                                config.intensity !== undefined
                                    ? Number(config.intensity)
                                    : 0.5,
                                0,
                                1,
                            ),
                            captureMode:
                                config.capture_mode === 'display' ||
                                config.capture_mode === 'dom'
                                    ? config.capture_mode
                                    : 'auto',
                            snapshotInterval: clamp(
                                config.snapshot_interval !== undefined
                                    ? Number(config.snapshot_interval)
                                    : 10,
                                0.25,
                                300,
                            ),
                            backgroundSelector:
                                typeof config.background_selector ===
                                    'string' && config.background_selector
                                    ? config.background_selector
                                    : null,
                            fallbackColor:
                                typeof config.fallback_color === 'string' &&
                                config.fallback_color
                                    ? config.fallback_color
                                    : '#1b2531',
                        };

                        hideError();

                        if (dropAlpha && dropColor) {
                            configure(true);
                        } else if (texturesLoading) {
                            pendingConfig = activeConfig;
                        } else {
                            pendingConfig = activeConfig;
                            loadDropTextures();
                        }
                    },

                    onPlay: function () {
                        playing = true;
                        startLoop();
                    },
                });

                // ---------------------------------------------------------------
                // Setup / teardown
                // ---------------------------------------------------------------

                function clamp(value, min, max) {
                    if (isNaN(value)) return min;
                    return Math.max(min, Math.min(max, value));
                }

                /**
                 * Load the inlined drop sprite textures, then apply any
                 * pending configuration.
                 */
                function loadDropTextures() {
                    texturesLoading = true;
                    var remaining = 2;
                    var failed = false;

                    function done() {
                        remaining--;
                        if (remaining > 0 || failed) return;
                        texturesLoading = false;
                        if (pendingConfig) {
                            pendingConfig = null;
                            configure(true);
                        }
                    }

                    function fail() {
                        if (failed) return;
                        failed = true;
                        texturesLoading = false;
                        plugin.error({
                            code: 'TEXTURE_LOAD_FAILED',
                            message:
                                'Failed to decode the inlined drop sprite textures.',
                            fatal: true,
                        });
                        showError('Failed to load rain textures');
                    }

                    dropAlpha = new Image();
                    dropAlpha.onload = done;
                    dropAlpha.onerror = fail;
                    dropAlpha.src = DROP_ALPHA_SRC;

                    dropColor = new Image();
                    dropColor.onload = done;
                    dropColor.onerror = fail;
                    dropColor.src = DROP_COLOR_SRC;
                }

                /**
                 * (Re)build the simulation, mirror and renderer from
                 * activeConfig.
                 *
                 * @param {boolean} [signalReady] - Send ready to the host
                 *     (new config only, not resize rebuilds)
                 */
                function configure(signalReady) {
                    stopLoop();
                    built = false;

                    var dpi = Math.min(window.devicePixelRatio || 1, MAX_DPI);
                    canvas.width = window.innerWidth * dpi;
                    canvas.height = window.innerHeight * dpi;

                    var intensity = activeConfig.intensity;

                    try {
                        raindrops = new Raindrops(
                            canvas.width,
                            canvas.height,
                            dpi,
                            dropAlpha,
                            dropColor,
                            {
                                minR: 20,
                                maxR: 50,
                                rainChance: 0.15 + 0.4 * intensity,
                                rainLimit: Math.max(
                                    1,
                                    Math.round(2 + 8 * intensity),
                                ),
                                dropletsRate: 20 + 60 * intensity,
                                dropletsSize: [3, 5.5],
                                trailRate: 1,
                                trailScaleRange: [0.25, 0.35],
                                collisionRadius: 0.45,
                                collisionRadiusIncrease: 0.0002,
                                dropletsCleaningRadiusMultiplier: 0.28,
                            },
                        );

                        // Quarter-resolution mirror: refraction reads it as a
                        // soft glass texture, so full detail is wasted work
                        var mirrorWidth = Math.max(
                            64,
                            Math.round(window.innerWidth / 4),
                        );
                        var mirrorHeight = Math.max(
                            64,
                            Math.round(window.innerHeight / 4),
                        );
                        mirror = new PageMirror(mirrorWidth, mirrorHeight, {
                            selector: activeConfig.backgroundSelector,
                            fallbackColor: activeConfig.fallbackColor,
                            snapshotInterval: activeConfig.snapshotInterval,
                        });

                        renderer = new RainRenderer(
                            canvas,
                            raindrops.canvas,
                            mirror.canvas,
                        );
                    } catch (e) {
                        plugin.error({
                            code: 'WEBGL_UNAVAILABLE',
                            message:
                                'Failed to initialise the WebGL rain renderer: ' +
                                (e && e.message ? e.message : 'unknown error'),
                            fatal: true,
                        });
                        showError('WebGL is not available');
                        return;
                    }

                    if (!mirror.available) {
                        plugin.error({
                            code: 'PARENT_CAPTURE_UNAVAILABLE',
                            message:
                                'The base page DOM could not be mirrored (cross-origin parent or standalone). Drops will refract the fallback colour unless display capture is granted.',
                            fatal: false,
                        });
                    } else {
                        mirror.snapshot();
                        mirror.refreshLiveElements();
                    }

                    if (activeConfig.captureMode === 'dom') {
                        DisplayCapture.deactivate();
                    } else {
                        attemptDisplayCapture(
                            activeConfig.captureMode === 'display',
                        );
                    }

                    built = true;
                    if (signalReady) {
                        plugin.ready();
                    }

                    if (playing) {
                        startLoop();
                    }
                }

                /**
                 * Try to start real-time tab capture. In kiosk deployments
                 * the browser grants this immediately (see the DisplayCapture
                 * notes); elsewhere the request is usually rejected for lack
                 * of a user gesture, so a one-shot retry is armed on the next
                 * interaction and the DOM mirror carries on meanwhile.
                 *
                 * @param {boolean} explicit - capture_mode is 'display', so
                 *     report the failure to the host
                 */
                function attemptDisplayCapture(explicit) {
                    DisplayCapture.start(function (ok, err) {
                        if (ok) {
                            console.info(
                                '[rain-overlay] display capture active - refracting the live tab feed',
                            );
                            return;
                        }
                        if (explicit && !displayFailReported) {
                            displayFailReported = true;
                            plugin.error({
                                code: 'DISPLAY_CAPTURE_FAILED',
                                message:
                                    'Tab capture was not granted (' +
                                    (err && err.name
                                        ? err.name
                                        : 'unknown error') +
                                    '). Falling back to DOM mirroring; video and canvas elements still update every frame.',
                                fatal: false,
                            });
                        }
                        armDisplayRetry();
                    });
                }

                function armDisplayRetry() {
                    if (displayRetryArmed) return;
                    displayRetryArmed = true;
                    var retry = function () {
                        document.removeEventListener('pointerdown', retry);
                        displayRetryArmed = false;
                        if (
                            activeConfig &&
                            activeConfig.captureMode !== 'dom'
                        ) {
                            attemptDisplayCapture(false);
                        }
                    };
                    document.addEventListener('pointerdown', retry);
                }

                // ---------------------------------------------------------------
                // Master animation loop
                // ---------------------------------------------------------------

                function frame() {
                    rafId = requestAnimationFrame(frame);

                    var mirrorChanged = mirror.update();
                    raindrops.update();

                    if (!renderer.draw(mirrorChanged)) {
                        // The mirror canvas was tainted by a cross-origin
                        // source - drop the capture layers and carry on
                        mirror.blockLive();
                        if (!taintReported) {
                            taintReported = true;
                            plugin.error({
                                code: 'PARENT_CAPTURE_TAINTED',
                                message:
                                    'A cross-origin source tainted the page mirror. Page capture disabled; drops will refract the page colour.',
                                fatal: false,
                            });
                        }
                        renderer.canvasBg = mirror.canvas;
                        renderer.draw(true);
                    }
                }

                function startLoop() {
                    if (!built || rafId !== null) return;
                    // Avoid a physics jump after a pause
                    raindrops.lastRender = null;
                    rafId = requestAnimationFrame(frame);
                }

                function stopLoop() {
                    if (rafId !== null) {
                        cancelAnimationFrame(rafId);
                        rafId = null;
                    }
                }

                // Save GPU time while the page is not visible
                document.addEventListener('visibilitychange', function () {
                    if (document.hidden) {
                        stopLoop();
                    } else if (playing) {
                        startLoop();
                    }
                });

                window.addEventListener('resize', function () {
                    if (resizeTimer) clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(function () {
                        resizeTimer = null;
                        if (activeConfig && dropAlpha && dropColor) {
                            configure();
                        }
                    }, RESIZE_DEBOUNCE_MS);
                });

                // ---------------------------------------------------------------
                // Error overlay helpers
                // ---------------------------------------------------------------

                function showError(message) {
                    var overlay = document.getElementById('error-overlay');
                    if (overlay) {
                        overlay.textContent = message;
                        overlay.style.display = 'flex';
                    }
                }

                function hideError() {
                    var overlay = document.getElementById('error-overlay');
                    if (overlay) {
                        overlay.style.display = 'none';
                    }
                }
            })();
        </script>
    </body>
</html>
