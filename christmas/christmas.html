                document.addEventListener('visibilitychange', function () {
                    if (document.hidden) {
                        stopLoop();
                    } else if (playing) {
                        startLoop();
                    }
                });

                // ---------------------------------------------------------------
                // Timers - plow runs and santa fly-bys
                // ---------------------------------------------------------------

                /**
                 * (Re)start the plow timer. The first run happens one full
                 * interval after play so the drift has time to build.
                 */
                function schedulePlow() {
                    if (plowTimer !== null) {
                        clearInterval(plowTimer);
                        plowTimer = null;
                    }
                    if (!activeConfig.showPlow) {
                        return;
                    }
                    plowTimer = setInterval(
                        startPlow,
                        activeConfig.plowInterval * 1000,
                    );
                }

                /**
                 * (Re)start the santa fly-by timer.
                 *
                 * @param {boolean} immediate - Launch a fly-by right away
                 */
                function scheduleSanta(immediate) {
                    if (santaTimer !== null) {
                        clearInterval(santaTimer);
                        santaTimer = null;
                    }
                    if (!activeConfig.showSanta) {
                        return;
                    }
                    if (immediate) {
                        launchSanta();
                    }
                    santaTimer = setInterval(
                        launchSanta,
                        activeConfig.santaInterval * 1000,
                    );
                }

                /**
                 * Fly santa across the screen at a random height within the
                 * middle 50% of the viewport.
                 */
                function launchSanta() {
                    if (!activeConfig.showSanta || document.hidden) {
                        return;
                    }
                    // Skip if a fly-by is still in progress
                    if (santaFlight.className.indexOf('flying') !== -1) {
                        return;
                    }

                    var height = SANTA_NATIVE_H * santaScale;
                    var viewHeight = window.innerHeight;
                    var centre = viewHeight * (0.25 + Math.random() * 0.5);
                    var top = Math.round(centre - height / 2);
                    top = Math.max(
                        0,
                        Math.min(viewHeight - Math.ceil(height), top),
                    );

                    santaFlight.style.top = top + 'px';
                    santaFlight.style.animationDuration =
                        activeConfig.santaDuration + 's';
                    santaFlight.className = 'flying';
                }

                santaFlight.addEventListener('animationend', function (event) {
                    // Descendant animation events bubble here too - only the
                    // flight itself should reset the element
                    if (event.animationName !== 'santa-fly') {
                        return;
                    }
                    // Reset so the next launch restarts the animation
                    santaFlight.className = '';
                });

                // ---------------------------------------------------------------
                // Resize handling
                // ---------------------------------------------------------------

                window.addEventListener('resize', function () {
                    if (resizeTimer !== null) {
                        clearTimeout(resizeTimer);
                    }
                    resizeTimer = setTimeout(function () {
                        resizeTimer = null;
                        updateScales();
                        resizeCanvas();
                        rebuildFlakes();
                        if (plowRunning) {
                            cancelPlow();
                        }
                        render();
                    }, RESIZE_DEBOUNCE_MS);
                });

                // Size everything immediately so the overlay looks right even
                // before the first config arrives
                updateScales();
                resizeCanvas();
                rebuildFlakes();

                // ---------------------------------------------------------------
                // Helpers
                // ---------------------------------------------------------------

                /**
                 * Clamp a numeric config value, falling back when missing or
                 * not a finite number.
                 *
                 * @param {*} value - Raw config value
                 * @param {number} min - Minimum allowed value
                 * @param {number} max - Maximum allowed value
                 * @param {number} fallback - Default when invalid
                 * @returns {number}
                 */
                function clampNumber(value, min, max, fallback) {
                    if (typeof value !== 'number' || !isFinite(value)) {
                        return fallback;
                    }
                    return Math.max(min, Math.min(max, value));
                }

                /**
                 * Read an optional boolean config value.
                 *
                 * @param {*} value - Raw config value
                 * @param {boolean} fallback - Default when undefined
                 * @returns {boolean}
                 */
                function readBoolean(value, fallback) {
                    return value !== undefined ? !!value : fallback;
                }

                /**
                 * Display an error message overlay.
                 */
                function showError(message) {
                    var overlay = document.getElementById('error-overlay');
                    if (overlay) {
                        overlay.textContent = message;
                        overlay.style.display = 'flex';
                    }
                }
            })();
        </script>
    </body>
</html>
